services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tradingagent-backend
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app/backend:/app/backend/tradingagents-core
      OLLAMA_BASE_URL: http://ollama:11434
      XDG_CACHE_HOME: /root/.tradingagents/cache
      YFINANCE_CACHE_DIR: /root/.tradingagents/cache/py-yfinance
    ports:
      - "8000:8000"
    volumes:
      - tradingagent-cache:/root/.tradingagents/cache
      - tradingagent-results:/root/.tradingagents/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tradingagent-frontend
    environment:
      BACKEND_API_KEY: ${BACKEND_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: tradingagent-ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  tradingagent-cache:
  tradingagent-results:
  ollama-data:
