services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tradingagent-backend
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app/backend:/app/backend/tradingagents-core
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - tradingagent-cache:/root/.tradingagents/cache
      - tradingagent-results:/root/.tradingagents/logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tradingagent-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: tradingagent-ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  tradingagent-cache:
  tradingagent-results:
  ollama-data: