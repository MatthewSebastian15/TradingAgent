services:
  backend:
    build:
      context: .
      network: host
      dockerfile: Dockerfile.backend
    container_name: tradingagent-backend
    dns:
      - 1.1.1.1
      - 1.0.0.1
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      REQUIRE_API_KEY_FOR_RATE_LIMIT: "false"
      REQUEST_BODY_MAX_BYTES: "16777216"
      RATE_LIMIT_STORAGE_BACKEND: sqlite
      RATE_LIMIT_DB_PATH: /home/tradingagent/.tradingagents/cache/rate_limits.sqlite3
      ANALYSIS_JOB_STORE_BACKEND: sqlite
      ANALYSIS_JOB_ROUTING_MODE: sticky_sessions
      ANALYSIS_STORAGE_BACKEND: sqlite
      DATA_CACHE_BACKEND: sqlite
      OLLAMA_BASE_URL: http://ollama:11434
      XDG_CACHE_HOME: /home/tradingagent/.tradingagents/cache
      YFINANCE_CACHE_DIR: /home/tradingagent/.tradingagents/cache/py-yfinance
      ANALYSIS_JOB_CACHE_DB_PATH: /home/tradingagent/.tradingagents/cache/analysis_jobs.sqlite3
      ANALYSIS_DB_PATH: /home/tradingagent/.tradingagents/cache/analysis_history.sqlite3
      DATA_CACHE_DB_PATH: /home/tradingagent/.tradingagents/cache/market_data.sqlite3
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/backend --reload-dir /app/packages
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages
      - tradingagent-cache:/home/tradingagent/.tradingagents/cache
      - tradingagent-results:/home/tradingagent/.tradingagents/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    container_name: tradingagent-frontend
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      VITE_DEV_PORT: "3000"
    command: >
      sh -c "npm install --include=dev && npm run dev:lan"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:0.24.0@sha256:32f9c3895f3a37cfcf637da5cabfd2d5d600cf3222ab294b366dae316e429589
    container_name: tradingagent-ollama
    dns:
      - 1.1.1.1
      - 1.0.0.1
    profiles:
      - ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tradingagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in backend/.env}
      POSTGRES_DB: tradingagents
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingagents"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tradingagent-cache:
  tradingagent-results:
  frontend-node-modules:
  ollama-data:
  pg_data:
