services:
  backend:
    build:
      context: .
      network: host
      dockerfile: Dockerfile.backend
    container_name: tradingagent-backend
    dns:
      - 1.1.1.1
      - 1.0.0.1
    env_file:
      - ./backend/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      XDG_CACHE_HOME: /root/.tradingagents/cache
      YFINANCE_CACHE_DIR: /root/.tradingagents/cache/py-yfinance
    ports:
      - "8000:8000"
    volumes:
      - tradingagent-cache:/root/.tradingagents/cache
      - tradingagent-results:/root/.tradingagents/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./backend 
          target: /app 
          ignore:
            - __pycache__/
            - .venv/

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tradingagent-frontend
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      BACKEND_API_KEY: ${BACKEND_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/

  ollama:
    image: ollama/ollama:latest
    container_name: tradingagent-ollama
    dns:
      - 1.1.1.1
      - 1.0.0.1
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  tradingagent-cache:
  tradingagent-results:
  ollama-data: