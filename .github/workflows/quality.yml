name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      TRADINGAGENTS_SKIP_DOTENV: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            packages/pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e packages
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==9.0.3 httpx==0.28.1 ruff==0.15.14

      - name: Import core package
        run: python -c "import tradingagents"

      - name: Ruff lint
        run: python -m ruff check backend packages

      - name: Ruff format check
        run: python -m ruff format --check backend packages

      - name: Python tests
        run: python -m pytest backend/tests packages/tests

      - name: Stale path guards
        run: |
          old_backend_path='backend/tradingagents-''core'
          old_packages_path='packages/tradingagents-''core'
          forbidden_packages='packages\.''tradingagents'
          forbidden_backend='backend\.''tradingagents'

          if git grep -n -e "$old_backend_path" -e "$old_packages_path" -- \
            ':!*.md' \
            ':!revised_tasks/**' \
            ':!.git/**'; then
            echo "Stale core path found in executable code/config"
            exit 1
          fi

          if git grep -n -e "$forbidden_packages" -e "$forbidden_backend" -- \
            ':!*.md' \
            ':!revised_tasks/**' \
            ':!.git/**'; then
            echo "Forbidden import package name found"
            exit 1
          fi

          if grep -R -n \
            -e "$old_backend_path" \
            -e "$old_packages_path" \
            -e 'packages/''tradingagents' \
            frontend/src frontend/dev frontend/package.json frontend/vite.config.* 2>/dev/null; then
            echo "Stale Python core path referenced from frontend"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend lint
        run: npm --prefix frontend run lint

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Frontend tests
        run: npm --prefix frontend run test -- --run
