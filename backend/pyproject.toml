[tool.pytest.ini_options]
pythonpath = [
    ".",
    "../packages",
]
testpaths = ["tests", "../packages/tests"]
addopts = "-ra"
markers = [
    "live_api: manual tests that call live vendor APIs",
    "postgres: tests requiring a live Postgres instance (skipped by default CI)",
]
filterwarnings = [
    "error::DeprecationWarning:backend.*",
    "error::DeprecationWarning:routes.*",
    "error::DeprecationWarning:services.*",
    "error::DeprecationWarning:tradingagents.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = [
    ".",
    "../packages/tradingagents",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".cache",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B"]
ignore = [
    "B008",
    "B904",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
